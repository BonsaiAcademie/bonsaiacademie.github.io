<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Académie Bonsaï - École de tradition japonaise">
  <title>Académie Bonsaï – École de tradition japonaise</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at center, rgba(255,255,255,.98) 0%, rgba(248,247,242,.96) 48%, rgba(232,229,218,.92) 100%);
      color: #242424;
      overflow-x: hidden;
    }

    .page {
      width: min(920px, 92vw);
      min-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 45px 25px;
      position: relative;
    }

    .page::before, .page::after {
      content: "";
      position: absolute;
      width: 90px;
      height: 1px;
      background: #b51d23;
      opacity: .7;
    }

    .page::before { top: 22px; left: 50%; transform: translateX(-50%); }
    .page::after { bottom: 22px; left: 50%; transform: translateX(-50%); }

    .logo {
      width: min(650px, 88vw);
      height: auto;
      display: block;
      margin-bottom: 35px;
      filter: drop-shadow(0 5px 10px rgba(0,0,0,.08));
    }

    .separator {
      width: 55px;
      height: 2px;
      background: #b51d23;
      margin: 3px auto 28px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 48px);
      font-weight: normal;
      letter-spacing: .04em;
      color: #292929;
    }

    .subtitle {
      margin: 10px 0 26px;
      font-size: clamp(15px, 2.3vw, 20px);
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #555;
    }

    .construction {
      margin: 0 0 18px;
      font-size: clamp(23px, 4vw, 34px);
      font-weight: bold;
      color: #b51d23;
    }

    .message {
      max-width: 650px;
      margin: 0 auto;
      font-size: clamp(16px, 2vw, 19px);
      line-height: 1.7;
      color: #444;
    }

    .bamboo {
      margin-top: 34px;
      font-size: 24px;
      letter-spacing: .45em;
      color: #777;
    }

    footer {
      margin-top: 38px;
      font-size: 13px;
      color: #777;
      letter-spacing: .04em;
    }

    @media (max-width: 600px) {
      .page {
        min-height: 100vh;
        padding: 30px 18px;
      }

      .logo {
        margin-bottom: 25px;
      }

      .message {
        line-height: 1.6;
      }

      .page::before { top: 12px; }
      .page::after { bottom: 12px; }
    }
  </style>
</head>
